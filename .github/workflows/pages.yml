name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  # Also started by preview.yml when the work branch changes: the test version is rebuilt next to the main one.
  workflow_dispatch:
    inputs:
      preview:
        description: Branch to publish as the test version under /preview/
        default: claude/writer-app-adhd-tmceif

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # GitHub Pages on the free plan needs a public repository; skip quietly while it is private.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_YANDEX_CLIENT_ID: ${{ vars.VITE_YANDEX_CLIENT_ID }}
          VITE_YANDEX_PROXY_URL: ${{ vars.VITE_YANDEX_PROXY_URL }}
      # The test version: the work branch, under /preview/, with its own database so it never touches real books.
      # Netlify previews do not open from everywhere; GitHub Pages does.
      - name: Build the test version
        # A broken work branch must never stop the main version from going up.
        continue-on-error: true
        env:
          BRANCH: ${{ inputs.preview || 'claude/writer-app-adhd-tmceif' }}
          BASE_PATH: /${{ github.event.repository.name }}/preview/
          VITE_DB_NAME: manuscript-preview
          VITE_YANDEX_CLIENT_ID: ${{ vars.VITE_YANDEX_CLIENT_ID }}
          VITE_YANDEX_PROXY_URL: ${{ vars.VITE_YANDEX_PROXY_URL }}
        run: |
          if ! git fetch --depth=1 origin "$BRANCH"; then echo "No branch $BRANCH, no test version"; exit 0; fi
          git worktree add ../preview FETCH_HEAD
          cd ../preview
          npm ci
          npm run build -- --outDir "$GITHUB_WORKSPACE/dist/preview"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
