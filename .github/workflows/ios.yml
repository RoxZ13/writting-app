name: iOS build

on:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -project ios/Manuscript.xcodeproj -scheme Manuscript -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
