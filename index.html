<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Manuscript." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Manuscript.</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // If the app fails to start, show why instead of a blank page.
      window.__bootErrors = []
      window.addEventListener('error', function (e) {
        window.__bootErrors.push(e.message || (e.target && e.target.src ? 'Не загрузился файл: ' + e.target.src : 'ошибка'))
      }, true)
      window.addEventListener('unhandledrejection', function (e) {
        window.__bootErrors.push(String(e.reason && e.reason.message || e.reason))
      })
      setTimeout(function () {
        var root = document.getElementById('root')
        if (root && root.getAttribute('data-ready')) return
        if (!root) return
        var panel = document.createElement('main')
        panel.style.cssText = 'font-family:system-ui,sans-serif;max-width:520px;margin:15vh auto;padding:0 16px;color:#1c1c1e'
        var title = document.createElement('h2')
        title.style.margin = '0 0 8px'
        title.textContent = 'Manuscript не запустился'
        var note = document.createElement('p')
        note.style.color = '#545458'
        note.textContent = 'Данные на устройстве не удалены. Сделайте скриншот этого экрана и отправьте его — по нему видно, что сломалось.'
        var details = document.createElement('pre')
        details.style.cssText = 'white-space:pre-wrap;background:#f2f2f4;padding:12px;border-radius:8px;font-size:13px'
        details.textContent = (window.__bootErrors.join('\n') || 'Ошибок нет, но приложение не ответило за 10 секунд.') + '\n\n' + navigator.userAgent
        var reload = document.createElement('button')
        reload.style.cssText = 'padding:8px 14px;border-radius:8px;border:1px solid #ccc;background:#fff'
        reload.textContent = 'Перезагрузить'
        reload.addEventListener('click', function () { location.reload() })
        panel.append(title, note, details, reload)
        root.replaceChildren(panel)
      }, 10000)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
